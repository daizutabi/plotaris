[build-system]
requires = ["uv_build<0.12"]
build-backend = "uv_build"

[project]
name = "plotaris"
version = "0.4.0"
description = "A utility library for Altair."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "daizutabi", email = "daizutabi@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
keywords = [
  "altair",
  "data science",
  "plotting",
  "polars",
  "python",
  "visualization",
]
dependencies = [
    "altair>=6",
    "matplotlib>=3.10.9",
]

[project.urls]
Documentation = "https://github.com/daizutabi/plotaris"
Source = "https://github.com/daizutabi/plotaris"
Issues = "https://github.com/daizutabi/plotaris/issues"

[dependency-groups]
dev = [
  "basedpyright>=1.38.1",
  "marimo>=0.20.2",
  "polars>=1",
  "prek>=0.3.3",
  "pytest-clarity>=1.0.1",
  "pytest-cov>=7.0.0",
  "pytest-mock>=3.15.1",
  "pytest-randomly>=4.0.1",
  "pytest-xdist>=3.8.0",
  "pytest>=9.0.2",
  "python-lsp-server>=1.14.0",
  "ruff>=0.15.2",
  "ty>=0.0.18",
  "vl-convert-python>=1.9.0.post1",
  "watchdog>=6.0.0",
]

[tool.pytest]
addopts = ["--cov=plotaris", "--cov-report=lcov:lcov.info", "--doctest-modules"]
strict_config = true
strict_markers = true
strict_parametrization_ids = true
strict_xfail = true

[tool.coverage.report]
exclude_lines = ["no cov", "raise NotImplementedError", "if TYPE_CHECKING:"]
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py312"
include = ["notebooks/**/*.py", "src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
preview = true
select = ["ALL"]
unfixable = ["F401"]
ignore = [
  "ANN401",
  "ARG001",
  "C901",
  "CPY001",
  "D",
  "DOC201",
  "DOC402",
  "N",
  "PLR",
  "PLW3201",
  "RET504",
  "RUF001",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["A001", "ANN", "ARG", "FBT001", "PLC1901", "PLR2004", "S101"]
"notebooks/*" = [
  "ANN",
  "ARG",
  "B",
  "ERA001",
  "I002",
  "INP001",
  "PLR1711",
  "RUF052",
  "T201",
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.format]
preview = true

[tool.basedpyright]
include = ["notebooks", "src", "tests"]
reportAny = false
reportExplicitAny = false
reportUnusedCallResult = false

[[tool.basedpyright.executionEnvironments]]
root = "notebooks"
reportMissingParameterType = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnusedExpression = false

[tool.ty.src]
include = ["notebooks", "src", "tests"]
